<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buy credits — Drive Folder Copier Lite</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Google Sans", Roboto, Arial, sans-serif;
    background: #f6f8fb; display: flex; align-items: center; justify-content: center;
    height: 100vh; color: #14171f;
  }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 36px 40px; text-align: center; max-width: 380px; }
  .spinner { width: 28px; height: 28px; border: 3px solid #e6e9ef; border-top-color: #1a73e8; border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status.error { color: #d93025; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <div id="status">Opening checkout…</div>
  </div>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
